<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Asphra</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #000; }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #e8f1ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
      background: rgba(10,15,25,0.35);
      border: 1px solid rgba(180,210,255,0.25);
      border-radius: 8px;
      padding: 8px 10px;
      white-space: pre;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>
  <script>
    // ----------------------------------------------------
    // Utils
    // ----------------------------------------------------
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const damp = (cur, tgt, lambda, dt) => lerp(cur, tgt, 1 - Math.exp(-lambda * dt));

    class Noise1D {
      sample(x) {
        const i0 = Math.floor(x), i1 = i0 + 1;
        const t = x - i0;
        const f = t * t * (3 - 2 * t);
        const h = (i) => {
          let n = i | 0;
          n = (n << 13) ^ n;
          return 1.0 - ((n * (n * n * 15731 + 789221) + 1376312589) & 0x7fffffff) / 1073741824.0;
        };
        return lerp(h(i0), h(i1), f);
      }
      fractal(x, oct = 4, lac = 2, gain = 0.5) {
        let amp = 1, freq = 1, sum = 0, norm = 0;
        for (let i = 0; i < oct; i++) {
          sum += this.sample(x * freq) * amp;
          norm += amp;
          amp *= gain;
          freq *= lac;
        }
        return sum / norm;
      }
    }

    // ----------------------------------------------------
    // Input
    // ----------------------------------------------------
    class Input {
      constructor() {
        this.keys = new Set();
        addEventListener("keydown", (e) => {
          if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
          this.keys.add(e.code);
        }, { passive: false });
        addEventListener("keyup", (e) => this.keys.delete(e.code), { passive: false });
      }
      get throttle() { return this.keys.has("KeyW") || this.keys.has("ArrowUp"); }
      get brake()    { return this.keys.has("KeyS") || this.keys.has("ArrowDown"); }
      get left()     { return this.keys.has("KeyA") || this.keys.has("ArrowLeft"); }
      get right()    { return this.keys.has("KeyD") || this.keys.has("ArrowRight"); }
      get boost()    { return this.keys.has("ShiftLeft") || this.keys.has("ShiftRight"); }
      get handbrake(){ return this.keys.has("Space"); }
    }

    // ----------------------------------------------------
    // Scene
    // ----------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ebae8);
    scene.fog = new THREE.FogExp2(0x8ebae8, 0.0048);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 3000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(220, 260, 120);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -300;
    sun.shadow.camera.right = 300;
    sun.shadow.camera.top = 300;
    sun.shadow.camera.bottom = -300;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 1200;
    scene.add(sun);

    const hemi = new THREE.HemisphereLight(0xc8e0ff, 0x3f6431, 0.55);
    scene.add(hemi);

    // Infinite-looking grass ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(16000, 16000),
      new THREE.MeshStandardMaterial({ color: 0x4d7a3a, roughness: 1.0, metalness: 0.0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -5;
    ground.receiveShadow = true;
    scene.add(ground);

    // ----------------------------------------------------
    // Road System (flat road only)
    // ----------------------------------------------------
    class RoadSystem {
      constructor(scene) {
        this.scene = scene;
        this.segmentLength = 8;
        this.roadWidth = 11;
        this.shoulderWidth = 16;
        this.visibleAhead = 150;
        this.keepBehind = 50;

        this.turnNoise = new Noise1D();
        this.segments = [];
        this.t = 0;

        this.headPos = new THREE.Vector3(0, 0, 0);
        this.heading = 0;

        // shared resources
        this.roadGeo = new THREE.PlaneGeometry(this.roadWidth, this.segmentLength + 0.35);
        this.roadMat = new THREE.MeshStandardMaterial({ color: 0x2f2f33, roughness: 0.95, metalness: 0.02 });

        this.shoulderGeo = new THREE.PlaneGeometry(this.shoulderWidth, this.segmentLength + 0.35);
        this.shoulderMat = new THREE.MeshStandardMaterial({ color: 0x4b7b39, roughness: 1.0 });

        this.dashMat = new THREE.MeshBasicMaterial({ color: 0xf2d85b });
        this.dashGeo = new THREE.BoxGeometry(0.18, 0.03, 2.2); // fixed orientation marking

        // simple trees
        this.treeTrunkGeo = new THREE.CylinderGeometry(0.12, 0.16, 1.0, 6);
        this.treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x5b3a26 });
        this.treeLeafGeo = new THREE.ConeGeometry(0.65, 1.8, 8);
        this.treeLeafMat = new THREE.MeshStandardMaterial({ color: 0x1e5d26 });

        for (let i = 0; i < this.visibleAhead; i++) this.addSegment();
      }

      addSegment() {
        // ONLY yaw turns. No pitch, no banking, no slope.
        const turnRate = this.turnNoise.fractal(this.t * 0.16) * 0.018;
        this.heading += turnRate;

        this.headPos.x += Math.sin(this.heading) * this.segmentLength;
        this.headPos.z -= Math.cos(this.heading) * this.segmentLength;
        this.headPos.y = 0;

        const seg = new THREE.Group();
        seg.position.set(this.headPos.x, 0, this.headPos.z);
        seg.rotation.set(0, this.heading, 0);

        // road plane
        const road = new THREE.Mesh(this.roadGeo, this.roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        seg.add(road);

        // shoulders (same orientation/height as road)
        const leftShoulder = new THREE.Mesh(this.shoulderGeo, this.shoulderMat);
        leftShoulder.rotation.x = -Math.PI / 2;
        leftShoulder.position.set(-(this.roadWidth * 0.5 + this.shoulderWidth * 0.5), -0.03, 0);
        leftShoulder.receiveShadow = true;
        seg.add(leftShoulder);

        const rightShoulder = new THREE.Mesh(this.shoulderGeo, this.shoulderMat);
        rightShoulder.rotation.x = -Math.PI / 2;
        rightShoulder.position.set((this.roadWidth * 0.5 + this.shoulderWidth * 0.5), -0.03, 0);
        rightShoulder.receiveShadow = true;
        seg.add(rightShoulder);

        // lane dashes (thin boxes -> never perpendicular)
        const dash1 = new THREE.Mesh(this.dashGeo, this.dashMat);
        dash1.position.set(0, 0.03, -1.9);
        seg.add(dash1);

        const dash2 = new THREE.Mesh(this.dashGeo, this.dashMat);
        dash2.position.set(0, 0.03, 1.9);
        seg.add(dash2);

        this.scene.add(seg);
        this.segments.push(seg);

        // trees upright in world
        if (Math.random() < 0.45) {
          const side = Math.random() < 0.5 ? -1 : 1;
          const sideDist = this.roadWidth * 0.5 + this.shoulderWidth + 4 + Math.random() * 8;
          const along = (Math.random() - 0.5) * (this.segmentLength * 0.8);

          const right = new THREE.Vector3(Math.cos(this.heading), 0, Math.sin(this.heading));
          const fwd = new THREE.Vector3(Math.sin(this.heading), 0, -Math.cos(this.heading));
          const base = this.headPos.clone()
            .add(right.multiplyScalar(side * sideDist))
            .add(fwd.multiplyScalar(along));

          const trunk = new THREE.Mesh(this.treeTrunkGeo, this.treeTrunkMat);
          trunk.position.set(base.x, 0.5, base.z);
          trunk.castShadow = true;
          this.scene.add(trunk);

          const leaf = new THREE.Mesh(this.treeLeafGeo, this.treeLeafMat);
          leaf.position.set(base.x, 1.8, base.z);
          leaf.castShadow = true;
          this.scene.add(leaf);

          seg.userData.trees = [trunk, leaf];
        }

        this.t += 1;
      }

      update(carPos) {
        const last = this.segments[this.segments.length - 1];
        if (last && carPos.distanceTo(last.position) < this.segmentLength * 100) {
          for (let i = 0; i < 25; i++) this.addSegment();
        }

        while (this.segments.length > this.visibleAhead + this.keepBehind) {
          const first = this.segments[0];
          const d = carPos.distanceTo(first.position);

          if (d > this.segmentLength * (this.keepBehind + 14)) {
            this.scene.remove(first);
            if (first.userData.trees) {
              for (const t of first.userData.trees) this.scene.remove(t);
            }
            this.segments.shift();
          } else break;
        }
      }

      closestSegment(pos) {
        let best = null, minD2 = Infinity;
        for (const s of this.segments) {
          const dx = pos.x - s.position.x;
          const dz = pos.z - s.position.z;
          const d2 = dx * dx + dz * dz;
          if (d2 < minD2) { minD2 = d2; best = s; }
        }
        return best;
      }

      getLocalOffsetX(seg, worldPos) {
        const p = worldPos.clone().sub(seg.position);
        const c = Math.cos(-seg.rotation.y);
        const s = Math.sin(-seg.rotation.y);
        return p.x * c - p.z * s;
      }

      getRoadHalfWidth() {
        return this.roadWidth * 0.5;
      }
    }

    // ----------------------------------------------------
    // Car
    // ----------------------------------------------------
    class Car {
      constructor(scene, road) {
        this.road = road;

        this.group = new THREE.Group();

        // red car
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 0.5, 2.3),
          new THREE.MeshPhysicalMaterial({
            color: 0xd62828,
            roughness: 0.28,
            metalness: 0.55,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
          })
        );
        body.position.y = 0.56;
        body.castShadow = true;
        this.group.add(body);

        const cabin = new THREE.Mesh(
          new THREE.BoxGeometry(0.95, 0.4, 1.0),
          new THREE.MeshStandardMaterial({ color: 0x1f2633, roughness: 0.25, metalness: 0.2 })
        );
        cabin.position.set(0, 0.9, -0.15);
        cabin.castShadow = true;
        this.group.add(cabin);

        scene.add(this.group);

        this.pos = new THREE.Vector3(0, 0.62, 3);
        this.yaw = 0;
        this.pitch = 0;
        this.roll = 0;

        this.speed = 0;
        this.steer = 0;

        // ~200 km/h cap
        this.maxSpeed = 55.6;  // m/s
        this.maxReverse = -12.0;
        this.accel = 17.5;
        this.brakeAccel = 32.0;
        this.engineBrake = 2.8;
        this.drag = 0.0065;

        this.steerRate = 2.3;
        this.steerReturn = 3.8;
        this.maxSteer = 0.72;
      }

      update(dt, input) {
        // speed
        if (input.throttle) this.speed += this.accel * dt;
        if (input.boost && input.throttle) this.speed += 5.0 * dt;
        if (input.brake) this.speed -= this.brakeAccel * dt;

        if (!input.throttle) this.speed -= this.engineBrake * dt * Math.sign(this.speed);
        this.speed -= this.drag * this.speed * Math.abs(this.speed) * dt;

        if (input.handbrake) this.speed -= 9.0 * dt * Math.sign(this.speed);

        if (Math.abs(this.speed) < 0.08) this.speed = 0;
        this.speed = clamp(this.speed, this.maxReverse, this.maxSpeed);

        // steering
        const steerInput = (input.left ? 1 : 0) - (input.right ? 1 : 0);
        if (steerInput !== 0) this.steer += steerInput * this.steerRate * dt;
        else this.steer = damp(this.steer, 0, this.steerReturn, dt);

        this.steer = clamp(this.steer, -this.maxSteer, this.maxSteer);

        const speedNorm = clamp(Math.abs(this.speed) / this.maxSpeed, 0, 1);
        const steerAuthority = lerp(1.0, 0.42, speedNorm);
        const yawRate = this.steer * steerAuthority * (0.7 + Math.abs(this.speed) * 0.028);
        this.yaw += yawRate * dt;

        this.pos.x += Math.sin(this.yaw) * this.speed * dt;
        this.pos.z -= Math.cos(this.yaw) * this.speed * dt;

        // flat road ride height (no pitch tilt)
        this.pos.y = damp(this.pos.y, 0.62, 12.0, dt);
        this.pitch = damp(this.pitch, 0, 10.0, dt);
        this.roll = damp(this.roll, -this.steer * this.speed * 0.003, 8.0, dt);

        // keep on road (soft correction)
        const seg = this.road.closestSegment(this.pos);
        if (seg) {
          const xLocal = this.road.getLocalOffsetX(seg, this.pos);
          const safeHalf = this.road.getRoadHalfWidth() - 0.8;
          const over = Math.abs(xLocal) - safeHalf;

          if (over > 0) {
            const side = Math.sign(xLocal);
            const rightX = Math.cos(seg.rotation.y);
            const rightZ = Math.sin(seg.rotation.y);

            const correction = Math.min(over, 2.0) * 5.0 * dt;
            this.pos.x -= rightX * side * correction;
            this.pos.z -= rightZ * side * correction;

            this.speed *= (1 - 0.9 * dt);
          }
        }

        this.group.position.copy(this.pos);
        this.group.rotation.set(this.pitch, this.yaw, this.roll);
      }
    }

    // ----------------------------------------------------
    // Rear-locked camera
    // ----------------------------------------------------
    class FollowCamera {
      constructor(camera, car) {
        this.camera = camera;
        this.car = car;
      }
      update(dt) {
        const speed = Math.abs(this.car.speed);
        const dist = 7.2 + speed * 0.04;
        const height = 2.7 + speed * 0.008;
        const lookAhead = 5.0 + speed * 0.05;

        const tx = this.car.pos.x - Math.sin(this.car.yaw) * dist;
        const tz = this.car.pos.z + Math.cos(this.car.yaw) * dist;
        const ty = this.car.pos.y + height;

        this.camera.position.x = damp(this.camera.position.x, tx, 10.0, dt);
        this.camera.position.y = damp(this.camera.position.y, ty, 10.0, dt);
        this.camera.position.z = damp(this.camera.position.z, tz, 10.0, dt);

        const lx = this.car.pos.x + Math.sin(this.car.yaw) * lookAhead;
        const lz = this.car.pos.z - Math.cos(this.car.yaw) * lookAhead;
        this.camera.lookAt(lx, this.car.pos.y + 0.8, lz);
      }
    }

    // ----------------------------------------------------
    // App loop
    // ----------------------------------------------------
    const input = new Input();
    const road = new RoadSystem(scene);
    const car = new Car(scene, road);
    const followCam = new FollowCamera(camera, car);
    const hud = document.getElementById("hud");
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 1 / 30);

      // keep ground centered (endless feel)
      ground.position.x = car.pos.x;
      ground.position.z = car.pos.z;

      car.update(dt, input);
      road.update(car.pos);
      followCam.update(dt);

      hud.textContent =
`Speed: ${Math.max(0, car.speed * 3.6).toFixed(0)} km/h
Cap:   200 km/h
Road segments: ${road.segments.length}`;

      renderer.render(scene, camera);
    }
    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
