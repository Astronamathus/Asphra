<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asphra</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="hud">
      <div class="hud__title">Asphra</div>
      <div class="hud__text">W / Up: accelerate</div>
      <div class="hud__text">S / Down: brake</div>
      <div class="hud__text">A D / Left Right: steer</div>
      <div class="hud__text">Space: handbrake</div>
      <div class="hud__text" id="speed">0 km/h</div>
    </div>
    <div class="credits">Asphra, by Astronamathus</div>
    <script src="https://unpkg.com/three@0.124.0/build/three.min.js"></script>
    <script defer src="./main.js"></script>
