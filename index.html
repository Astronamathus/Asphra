<!DOCTYPE html>
<html>
<head>
  <title>Asphra</title>
  <style>
    body { margin: 0; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>
  <script>let roadSegments = [];
let segmentLength = 5;
let visibleSegments = 10;
let currentAngle = 0; // direction of road
let visualAngle = 0;
let currentHeight = -1;     // starting height
let targetSlope = 0;        // slope direction
let roadMaterial = new THREE.MeshStandardMaterial({color: 0x333333,roughness: 0.9,metalness: 0.1});
let turnLeft = false;
let turnRight = false;
let moveForward = false;
let moveBackward = false;
let boost = false;
let handbrake = false;

//Road turning management
let targetAngle = 0;
let roadAngle = 0;

// Physics
let turnSpeed = 0;
let targetY = 0;
let maxTurn = 0.03;
let turnAccel = 0.002;

let velocity = 0;
let maxSpeed = 0.6;
let acceleration = 0.01;
let friction = 0.98;
let brakeForce = 0.02;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5aa9e6);
scene.fog = new THREE.FogExp2(0x5aa9e6, 0.02);
const groundGeo = new THREE.PlaneGeometry(1000, 1000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
const ground = new THREE.Mesh(groundGeo, groundMat);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -2;

scene.add(ground);
// Camera (basic, real logic in camera.js)
const camera = new THREE.PerspectiveCamera(100, window.innerWidth / window.innerHeight, 0.1, 1000);

// Renderer
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
const light = new THREE.PointLight(0xffffff, 5);
light.position.set(10, 10, 10);
scene.add(light);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

function createRoad(scene) 
{
  for (let i = 0; i < visibleSegments; i++) 
  {
    addSegment(scene);
  }
}

function addSegment(scene) {
  const geometry = new THREE.PlaneGeometry(10, segmentLength + 0.1); // slight overlap fixes seams
  const segment = new THREE.Mesh(geometry, roadMaterial);

  // First segment (origin)
  if (roadSegments.length === 0) 
  {
    segment.position.set(0, -1, 0);
    segment.rotation.set(-Math.PI / 2, 0, 0);
    scene.add(segment);
    roadSegments.push(segment);

    createLaneDashes(segment);
    createBarriers(segment);
    return;
  }

  const last = roadSegments[roadSegments.length - 1];

  // --- SMOOTH TURNING ---
  const maxTurnPerSegment = 0.03;

  // Slowly change target direction (less jitter)
  if (Math.random() < 0.1) 
  {
    targetAngle += (Math.random() - 0.5) * 0.1;
  }

  // Clamp turning so it doesn't go crazy
  targetAngle = Math.max(-0.5, Math.min(0.5, targetAngle));

  // Smooth interpolation (THIS removes jitter)
  roadAngle += (targetAngle - roadAngle) * 0.1;

  // --- FORWARD MOVEMENT ---
  let dx = Math.sin(roadAngle) * segmentLength;
  let dz = Math.cos(roadAngle) * segmentLength;

  segment.position.x = last.position.x + dx;
  segment.position.z = last.position.z - dz;

  // --- SLOPE (UNCHANGED BUT CLEANED) ---
  let slopeChange = (Math.random() - 0.5) * 0.02;
  targetSlope += slopeChange;
  targetSlope = Math.max(-0.1, Math.min(0.1, targetSlope));

  currentHeight += targetSlope * segmentLength;
  segment.position.y = currentHeight;

  // --- ROTATION ---
  let tilt = Math.atan(targetSlope);

  segment.rotation.set(
    -Math.PI / 2 + tilt, // slope tilt
    roadAngle,           // direction
    0
  );

  // --- SNAP (tiny precision fix for seams) ---
  segment.position.x = parseFloat(segment.position.x.toFixed(4));
  segment.position.z = parseFloat(segment.position.z.toFixed(4));

  scene.add(segment);
  roadSegments.push(segment);

  function createTerrain(segment) 
  {
    const geo = new THREE.PlaneGeometry(30, segmentLength + 1);
    const mat = new THREE.MeshStandardMaterial({ color: 0x228B22 });

    const terrain = new THREE.Mesh(geo, mat);

    terrain.rotation.x = segment.rotation.x;
    terrain.rotation.y = segment.rotation.y;

    terrain.position.y = -0.3;
    segment.add(terrain);
  }
  const skirtGeo = new THREE.BoxGeometry(0.5, 5, segmentLength);

  const leftSkirt = new THREE.Mesh(skirtGeo, groundMat);
  leftSkirt.position.set(-5.5, -2.5, 0);

  const rightSkirt = new THREE.Mesh(skirtGeo, groundMat);
  rightSkirt.position.set(5.5, -2.5, 0);
  segment.add(leftSkirt);
  segment.add(rightSkirt);

  function addTrees(segment) 
  {
    const treeGeo = new THREE.ConeGeometry(0.5, 2, 6);
    const treeMat = new THREE.MeshStandardMaterial({ color: 0x0b6623 });

    const tree = new THREE.Mesh(treeGeo, treeMat);

    tree.position.x = (Math.random() < 0.5 ? -8 : 8);
    segment.add(tree);
  }

  createTerrain(segment);
  createBarriers(segment);
  createLaneDashes(segment);
  addTrees(segment);
}
  function createLaneDashes(parentSegment) 
  {

  const dashLength = 3;
  const gap = 1;

  const dashGeometry = new THREE.PlaneGeometry(dashLength, 0.3);
  const dashMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });

  for (let i = -segmentLength / 2; i < segmentLength / 2; i += dashLength + gap) {
    const dash = new THREE.Mesh(dashGeometry, dashMaterial);

    // Lay flat
    dash.rotation.z = -Math.PI / 2;
    dash.rotation.y = 0; // let parent handle rotation

    
    // Slightly above road surface
    dash.position.set(0, 0.02, i);

    parentSegment.add(dash);
  }
}
function updateRoad(scene, car) {
  if (roadSegments.length === 0) return;

  let first = roadSegments[0];
  let last = roadSegments[roadSegments.length - 1];

  // Distance between car and last segment
  let dist = car.position.distanceTo(last.position);

  if (dist < segmentLength * 5) {
    // Add new segment ahead
    addSegment(scene);

    // Remove old segment behind
    scene.remove(first);
    roadSegments.shift();
  }
}

//Barriers
function createBarriers(segment) {
  const barrierHeight = 1;
  const barrierWidth = 0.3;
  const roadWidth = 10;

  const geometry = new THREE.BoxGeometry(barrierWidth, barrierHeight, segmentLength);
  const material = new THREE.MeshStandardMaterial({ color: 0xffffff });

  // LEFT barrier
  const leftBarrier = new THREE.Mesh(geometry, material);
  leftBarrier.position.set(-roadWidth / 2, barrierHeight / 2, 0);

  // RIGHT barrier
  const rightBarrier = new THREE.Mesh(geometry, material);
  rightBarrier.position.set(roadWidth / 2, barrierHeight / 2, 0);

  // Match road tilt (IMPORTANT)
  leftBarrier.rotation.x = segment.rotation.x;
  rightBarrier.rotation.x = segment.rotation.x;

  segment.add(leftBarrier);
  segment.add(rightBarrier);
}

// Controls
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") turnLeft = true;
  if (e.key === "ArrowRight") turnRight = true;
  if (e.key === "ArrowUp") moveForward = true;
  if (e.key === "ArrowDown") moveBackward = true;
  if (e.key === "Shift") boost = true;
  if (e.key === " ") handbrake = true;
});

document.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft") turnLeft = false;
  if (e.key === "ArrowRight") turnRight = false;
  if (e.key === "ArrowUp") moveForward = false;
  if (e.key === "ArrowDown") moveBackward = false;
  if (e.key === "Shift") boost = false;
  if (e.key === " ") handbrake = false;
});

// Create car
function createCar(scene) {
  const geometry = new THREE.BoxGeometry();
  const material = new THREE.MeshPhysicalMaterial({
    color: 0xFFFF00,
    metalness: 0.5,
    roughness: 0.2,
    clearcoat: 1.0,
    clearcoatRoughness: 0.1
  });

  const cube = new THREE.Mesh(geometry, material);
  cube.position.y = 0.5;
  scene.add(cube);

  return cube;
}

// Update car
function updateCar(cube) {
  // Turning
  if (turnLeft) turnSpeed -= turnAccel;
  if (turnRight) turnSpeed += turnAccel;

  turnSpeed = Math.max(-maxTurn, Math.min(maxTurn, turnSpeed));
  turnSpeed *= 0.85;

  cube.rotation.y += turnSpeed;
  cube.rotation.z = -turnSpeed * 5;

  // Acceleration
  if (moveForward) velocity += acceleration;
  if (boost) velocity += acceleration * 0.5;
  velocity = Math.max(-0.3, Math.min(maxSpeed * 1.5, velocity));
  if (moveBackward) velocity -= brakeForce;
  if (handbrake) {
    if (velocity >= 0){
      velocity -= brakeForce*0.5;
    }
  }

  velocity = Math.max(-0.3, Math.min(maxSpeed, velocity));
  velocity *= friction;

  if (Math.abs(velocity) < 0.001) velocity = 0;


  let closest = null;
  let minDist = Infinity;

  for (let seg of roadSegments) {
    let dx = cube.position.x - seg.position.x;
    let dz = cube.position.z - seg.position.z;
    let dist = dx * dx + dz * dz;

    if (dist < minDist) {
      minDist = dist;
      closest = seg;
    }
  }

  if (closest) {
    targetY = closest.position.y + 0.5;

    // Match road tilt
    cube.rotation.x += (closest.rotation.x + Math.PI / 2 - cube.rotation.x) * 0.1;
  }

  // Movement
  cube.position.x += Math.sin(cube.rotation.y) * velocity;
  cube.position.z -= Math.cos(cube.rotation.y) * velocity;
}

function updateCamera(camera, cube) {
  let distance = 8;
  let height = 3;
  let speedFactor = Math.abs(velocity) * 2;

  let dynamicDistance = distance + speedFactor;
  let dynamicHeight = height + speedFactor * 0.3;
    // Smooth follow
    cube.position.y += (targetY - cube.position.y) * 0.2;

  let targetX = cube.position.x - Math.sin(cube.rotation.y) * dynamicDistance;
  let targetZ = cube.position.z + Math.cos(cube.rotation.y) * dynamicDistance;
  targetY = cube.position.y + dynamicHeight;


  // Smooth follow
  camera.position.x += (targetX - camera.position.x) * 0.1;
  camera.position.y += (targetY - camera.position.y) * 0.1;
  camera.position.z += (targetZ - camera.position.z) * 0.1;

  // Look forward (not center)
  let lookX = cube.position.x + Math.sin(cube.rotation.y);
  let lookZ = cube.position.z - Math.cos(cube.rotation.y);

  camera.lookAt(lookX, cube.position.y, lookZ);

}


// Fog
scene.fog = new THREE.Fog(0x111111, 10, 50);


// Create systems
createRoad(scene);
const car = createCar(scene);

// Initial camera position
camera.position.z = 10;

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  updateCar(car);
  updateRoad(scene, car);
  updateCamera(camera, car);

  renderer.render(scene, camera);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  light.castShadow = true;
  light.shadow.mapSize.width = 1024;
  light.shadow.mapSize.height = 1024;

  ground.receiveShadow = true;
  car.castShadow = true;
}

animate();</script>
</body>
</html>
